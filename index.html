<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crete+Round:ital@0;1&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="body">
        <div class="header">
            <h1>Tip Calculator</h1>
        </div>
        <div class="input">
            <label for="billamt">Enter the bill amount:</label><br>
            <input type="number" name="billamt" id="billamt"><br><br>
            <label for="tipperc">Tip percentage:</label><br>
            <input type="number" name="tipperc" id="tipperc"><br><br> 
        <div class="btn">
            <button id="calc" onclick="calculateTip()">calculate</button>
        </div>
        <div class="output">
            <p>Total: <span id="resultamt">0.00</span></p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
